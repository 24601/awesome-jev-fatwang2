name: Jev review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review with Jev
        id: review
        # Provider inputs below need a jev-review-action commit with provider-chain support;
        # bump this pin to that release, or the pinned action ignores them with a warning.
        uses: fatwang2/jev-review-action@0cc579cb2aa5b160b6d8a788a4775953a31c6e1e # Review comments include GitHub listing stats
        with:
          # Repository variable JEV_PROVIDERS orders typesafe, vercel and cloudflare; unset means typesafe only.
          # Unlisted providers stay off even when their secrets exist; unset secrets are skipped.
          jev-providers: ${{ vars.JEV_PROVIDERS }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          ai-gateway-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jev-review-${{ github.event.pull_request.number }}
          path: jev-report.json
          if-no-files-found: ignore
          retention-days: 14
